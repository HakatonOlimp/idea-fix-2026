version: '3'
services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: olympiad_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d olympiad_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.base
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/schools_catalog.xlsx:/app/schools_catalog.xlsx 
    environment:
      DATABASE_URL: postgresql+psycopg2://myuser:mypassword@db:5432/olympiad_db

  frontend:
    image: nginx:1.21-alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html
    restart: always
    depends_on:
      - backend

volumes:
  pgdata:
